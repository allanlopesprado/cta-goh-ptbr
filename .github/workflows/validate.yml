name: Validate

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build-pak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test translation and package tools
        run: node --test tools/*.test.mjs

      - name: Validate translated catalogs
        run: node tools/translation-audit.mjs --check

      - name: Build pak
        run: node tools/pack-translation.mjs --build

      - name: Validate pak structure
        run: node tools/pack-translation.mjs --check

      - name: Validate release metadata and expected checksum
        run: node tools/release-translation.mjs --check
