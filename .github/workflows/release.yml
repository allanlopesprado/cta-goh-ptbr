name: Release Pak

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nova tag vX.Y.Z, igual a translation/release.json'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: translation-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate explicit release request
        id: release_info
        uses: actions/github-script@v9
        with:
          script: |
            const fs = await import('node:fs');
            const {pathToFileURL} = await import('node:url');
            const {validateTrigger, validateReleaseMetadata} = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/tools/release-translation.mjs`).href);
            const metadata = validateReleaseMetadata(JSON.parse(fs.readFileSync('translation/release.json', 'utf8')));
            const tag = validateTrigger({eventName: context.eventName, ref: context.ref, manualTag: context.payload.inputs?.tag}, metadata.tag);
            // Include drafts, so a failed upload cannot be silently overwritten.
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            if (releases.some(release => release.tag_name === tag)) {
              throw new Error(`A release ${tag} já existe, inclusive rascunho; não será sobrescrita.`);
            }
            if (context.eventName === 'workflow_dispatch') {
              try {
                await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
                throw new Error(`A tag ${tag} já existe; escolha uma nova tag.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.setOutput('tag', tag);
            core.setOutput('title', metadata.title);

      - name: Require a commit integrated into main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Test and validate translations
        run: |
          node --test tools/*.test.mjs
          node tools/translation-audit.mjs --check

      - name: Build and validate pak
        run: |
          node tools/pack-translation.mjs --build
          node tools/pack-translation.mjs --check

      - name: Verify release metadata, hash and prepare assets
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        run: node tools/release-translation.mjs --prepare "$RELEASE_TAG"

      - name: Create new tag for manual request
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          commit_sha=$(git rev-parse HEAD)
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$commit_sha"

      - name: Publish exactly one release after asset verification
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_info.outputs.title }}
        run: |
          gh release create "$RELEASE_TAG" dist/default.pak dist/default.pak.sha256 \
            --verify-tag --draft --title "$RELEASE_TITLE" --notes-file dist/release-notes.md
          gh release download "$RELEASE_TAG" --pattern 'default.pak*' --dir dist/published-check
          cmp dist/default.pak dist/published-check/default.pak
          cmp dist/default.pak.sha256 dist/published-check/default.pak.sha256
          gh release edit "$RELEASE_TAG" --draft=false --latest
